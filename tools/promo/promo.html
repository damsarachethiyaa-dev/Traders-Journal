<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Traders Journal — App Film</title><link rel="stylesheet" href="../../fonts/fonts.css"><style>
*{box-sizing:border-box}body{margin:0;background:#060908;color:#f4f6ef;font-family:Inter,sans-serif;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}canvas{display:block;width:min(100vw,calc((100vh - 64px)*16/9));height:auto}#controls{height:64px;display:flex;align-items:center;gap:18px;width:min(92vw,1200px)}button{background:#b7ff5c;color:#10160b;border:0;border-radius:20px;padding:9px 22px;font-weight:700;cursor:pointer}input{flex:1;accent-color:#b7ff5c}span{font-size:12px;color:#a8b3a4}body.render canvas{width:1920px;height:1080px}body.render #controls{display:none}
</style></head><body><canvas id="film" width="1920" height="1080"></canvas><div id="controls"><button id="play">Play film</button><input id="seek" type="range" min="0" max="120" step="0.01" value="0" aria-label="Seek video"><span id="time">0:00 / 2:00</span><button id="sound">Sound on</button></div><audio id="audio" src="../../media/promo-audio/master.wav" preload="auto"></audio><script src="film.js"></script></body></html>
