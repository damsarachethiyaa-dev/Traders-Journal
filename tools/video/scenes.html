<!doctype html>
<html><head><meta charset="utf-8"><title>Traders Journal – MT5 setup video</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
:root{--bg:#09090b;--card:#0e0e10;--card2:#131315;--cell:#141416;--border:#1c1c1f;--border2:#27272a;--text:#ececee;--muted:#8b8b93;--faint:#55555c;--blue:#3b82f6;--green:#22c55e;--green2:#19d38a;--red:#f05252;--amber:#f59e0b;--sans:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,monospace;--head:'Space Grotesk','Inter',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;background:radial-gradient(1000px 520px at 50% -10%,#16203a 0%,#0a0b10 62%,#07070a 100%);font:13px/1.4 var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;display:none}
.cam{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.ov{position:absolute;inset:0;pointer-events:none}
.win{position:absolute;border-radius:12px;background:var(--bg);border:1px solid #2d2e34;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03);overflow:hidden;left:70px;top:62px;width:1140px;height:560px}
.tb{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border);background:#0b0b0d}
.tb:after{content:"–    ▢    ✕";margin-left:auto;letter-spacing:2px;color:#777}
.appmark{width:9px;height:11px;border:1.6px solid #ddd;border-radius:2px}
/* ---- app ---- */
.side{position:absolute;left:0;top:32px;bottom:0;width:176px;border-right:1px solid var(--border);padding:16px 14px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:9px;font:700 15px var(--head);margin-bottom:14px;white-space:nowrap}
.logo .mark{width:16px;height:19px;border:2px solid #fff;border-radius:3px;position:relative;display:inline-block}
.addbtn{height:28px;border:1px solid var(--blue);color:var(--blue);background:rgba(59,130,246,.12);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:500;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 8px;font-size:11.5px;font-weight:500;border-radius:6px;color:#d8d8dc;margin-bottom:2px}
.nav i{font-style:normal;width:14px;text-align:center;color:var(--muted)}
.nav.on{background:#17171a;font-weight:600;color:#fff}.nav.on i{color:var(--blue)}
.sidefoot{position:absolute;left:14px;bottom:14px;font-size:10.5px;color:var(--faint)}
.main{position:absolute;left:176px;top:32px;right:0;bottom:0;overflow:hidden}
.pg{position:absolute;inset:0;padding:22px 24px;opacity:0;visibility:hidden}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px}.ph h2{font:700 20px var(--head)}
.live{font-size:11px;color:var(--green2);font-weight:600}
.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;height:74px}
.tile small{display:block;font-size:9.5px;letter-spacing:1.2px;color:var(--muted);font-weight:600}
.tile b{display:block;font:700 19px var(--head);margin-top:5px;white-space:nowrap}
.tile span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.green{color:var(--green2)}.red{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.pt{font-weight:600;font-size:12px;margin-bottom:8px}
.eq{height:300px;position:relative}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px}
.trh,.trr{display:grid;grid-template-columns:1.2fr .8fr 1fr .8fr 1fr;padding:0 16px;align-items:center}
.trh{height:34px;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.trr{height:38px;font-size:12.5px;border-bottom:1px solid #151517;background:var(--card)}
.trr b{font-weight:600}.buy{color:var(--green2)}.sell{color:var(--red)}
/* connections */
.scr{position:absolute;left:24px;right:24px;top:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.direct{border-color:#1f3a6e;background:linear-gradient(180deg,#0c1220,#0e0e10)}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mtl{width:36px;height:36px;border-radius:9px;background:#1d2c4d;color:#7fb0ff;display:grid;place-items:center;font:700 12px var(--head)}
.dh b{font-size:14.5px;display:block}.dh small{font-size:11px;color:var(--muted)}
.bdg{margin-left:auto;font-size:11px;font-weight:700;border-radius:999px;padding:5px 12px}
.bdg.off{background:#241517;color:#f58a8a;border:1px solid #4a2326}
.bdg.on{background:#0f2a1b;color:#2ee06f;border:1px solid #1d5a35}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tiles .tile{background:#08080a;height:70px}
.acts{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--border2);background:#17171a;color:#fff;font:600 12px var(--sans);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--blue);border-color:var(--blue)}.btn.pri.press{background:#2563eb;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.btn.dng{color:#f87171;margin-left:auto}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:12px}
.box{width:16px;height:16px;border:1.5px solid #5a5a62;border-radius:4px;display:inline-grid;place-items:center;font-size:11px;color:#fff;font-style:normal}
.chk.on .box,.box.on{background:var(--blue);border-color:var(--blue)}
.lbl{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:6px}
.log{background:#060607;border:1px solid var(--border);border-radius:8px;padding:8px 12px;height:96px;overflow:hidden;font:500 11px/1.75 var(--mono)}
.lr{display:flex;gap:12px;color:#a0a0a8}.lr span:first-child{color:#5d5d66;min-width:64px}.lr.ok{color:#2ee06f}.lr.info{color:#7fb0ff}.lr.warn{color:#f5b84b}
.eah{font-weight:600;font-size:13px;color:#cfcfd4;margin-bottom:14px}
.ea{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.cl{font-size:11px;font-weight:600;color:#a8a8b0;margin:0 0 6px}
.inp{height:34px;border:1px solid var(--border2);background:#08080a;border-radius:8px;padding:0 12px;display:flex;align-items:center;font-size:12.5px;margin-bottom:14px}
.ver{border:1px solid var(--blue);background:rgba(59,130,246,.1);border-radius:8px;padding:8px 12px;margin-bottom:14px}.ver b{display:block;font-size:12.5px}.ver small{color:var(--muted);font-size:10.5px}
.gen{height:38px;width:100%;border-radius:8px;background:var(--blue);color:#fff;font:700 12.5px var(--sans);display:grid;place-items:center}
.gen.press{background:#2563eb}
.ro{display:flex;gap:10px;font-size:11px;color:#a8a8b0;background:#0a0a0c;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:14px;line-height:1.55}.ro b{color:#e8e8ec}
.res{opacity:0}
.codebox{border:1px dashed #2f4f8f;background:#0b1424;border-radius:10px;padding:14px;text-align:center;margin-bottom:12px}
.codebox small{display:block;font-size:10px;letter-spacing:1.3px;color:#7f9fd6;font-weight:700}
.codebox b{display:block;font:700 28px var(--mono);letter-spacing:4px;margin:6px 0 4px;color:#fff}
.codebox span{font-size:11px;color:var(--muted)}
.dl{height:38px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;gap:8px;font:700 12.5px var(--sans);color:#fff}
.dl.press{background:#2563eb}
.dl.hidden{opacity:.0}
/* caret */
.typing:after{content:"";display:inline-block;width:1.5px;height:1.05em;background:currentColor;margin-left:1px;vertical-align:-2px}
/* ---- MT5 ---- */
.mt5{background:#1a1b1f;border-color:#34353b}.mt5 .tb{background:#232429;color:#aaa;border-color:#34353b}
.mbar{position:absolute;left:0;right:0;top:32px;height:24px;background:#25262b;border-bottom:1px solid #34353b;display:flex;align-items:center;padding:0 8px;gap:2px;font-size:11.5px;color:#d5d5d8}
.mbar span{padding:3px 9px;border-radius:3px}.mbar span.hot{background:#3b3d46}
.tbar{position:absolute;left:0;right:0;top:56px;height:32px;background:#202126;border-bottom:1px solid #34353b;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;color:#c8c8cc}
.tbar i{width:22px;height:18px;border-radius:4px;background:#2d2f37;display:inline-block}
.tbar .algo{padding:4px 10px;border-radius:4px;background:#2d2f37;display:inline-flex;gap:6px;align-items:center;margin-left:8px}.algo u{width:9px;height:9px;border-radius:50%;background:#e5534b;display:inline-block}
.mid{position:absolute;left:0;right:0;top:88px;height:302px;display:flex}
.lp{width:208px;border-right:1px solid #34353b;display:flex;flex-direction:column;background:#1e1f24}
.pane{flex:1;overflow:hidden;font-size:10.8px;color:#cfcfd3;border-bottom:1px solid #34353b}
.pane h5{font:600 10.5px var(--sans);background:#27282e;padding:4px 8px;color:#b9b9bf;border-bottom:1px solid #34353b}
.mwr{display:flex;justify-content:space-between;padding:3px 10px;font:500 10.5px var(--mono)}.mwr b{color:#7dd3fc;font-weight:500}
.nvr{padding:3px 10px;white-space:nowrap}.nvr.l2{padding-left:26px}.nvr.l3{padding-left:42px}
.chartw{position:relative;flex:1;background:#0f1013}
.ctitle{position:absolute;left:12px;top:8px;font:600 11px var(--mono);color:#d5d5d8}
.smile{position:absolute;right:14px;top:6px;font-size:18px;color:#ffd24a}
.toolbox{position:absolute;left:0;right:0;top:390px;height:148px;background:#1e1f24;border-top:1px solid #34353b}
.tabs{display:flex;background:#25262b;border-bottom:1px solid #34353b;font-size:11px}
.tabs span{padding:5px 14px;color:#a8a8ae;border-right:1px solid #34353b}.tabs span.on{background:#1e1f24;color:#fff}.tabs span.hot{background:#3b3d46;color:#fff}
.tbl{width:100%;border-collapse:collapse;font:500 10.8px var(--mono);color:#d0d0d4}.tbl th{text-align:left;font:600 10.5px var(--sans);color:#9a9aa2;padding:4px 10px;border-bottom:1px solid #34353b}.tbl td{padding:3px 10px}
.pl{color:#4ade80}.mi{color:#f87171}
.exlog{padding:8px 12px;font:500 11px/1.7 var(--mono);color:#b5b5ba}.exlog .g{color:#4ade80}
.stbar{position:absolute;left:0;right:0;bottom:0;height:22px;background:#25262b;border-top:1px solid #34353b;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#a8a8ae}
.conn{font:600 11px var(--mono)}.conn.bad{color:#f87171}.conn.good{color:#4ade80}
.dd{position:absolute;background:#2a2b31;border:1px solid #44454d;border-radius:6px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:11.5px;color:#e5e5e8;width:230px}
.dd div{padding:5px 12px;border-radius:4px;display:flex;justify-content:space-between}.dd em{font-style:normal;color:#8a8a92}.dd div.hot{background:#3b6fd4;color:#fff}.dd hr{border:0;border-top:1px solid #44454d;margin:4px 0}
/* light dialogs */
.dlg{position:absolute;background:#f3f3f3;color:#171717;border:1px solid #8c8c8c;border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.55);font:12px var(--sans);overflow:hidden}
.dlg .dt{height:30px;background:#fff;display:flex;align-items:center;padding:0 12px;font-size:12px;border-bottom:1px solid #e0e0e0}
.dlg .dt:after{content:"✕";margin-left:auto;color:#666}
.dlg .bd{padding:16px 18px}
.dlg .fld{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:8px;margin-bottom:10px}
.dlg .in{height:26px;border:1px solid #9a9a9a;background:#fff;border-radius:3px;padding:0 8px;display:flex;align-items:center;font-size:12px}
.dlg .bt{height:28px;min-width:84px;padding:0 14px;border:1px solid #adadad;background:#e6e6e6;border-radius:4px;display:inline-grid;place-items:center;font-size:12px}
.dlg .bt.def{border-color:#2563eb;background:#dbe8ff}
.dlg .tabs2{display:flex;gap:2px;border-bottom:1px solid #bbb;margin-bottom:12px}.dlg .tabs2 span{padding:5px 12px;border:1px solid transparent;font-size:11.5px;color:#333}.dlg .tabs2 span.on{background:#fff;border-color:#bbb;border-bottom-color:#fff;margin-bottom:-1px}.dlg .tabs2 span.hot{background:#dbe8ff}
.cb{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}.cb i{width:14px;height:14px;border:1px solid #666;background:#fff;display:inline-grid;place-items:center;font-size:11px;font-style:normal;color:#fff}.cb i.on{background:#2563eb;border-color:#2563eb}
.lst{border:1px solid #9a9a9a;background:#fff;height:90px;margin-top:8px;font:12px var(--mono)}.lst div{padding:4px 8px;height:24px;display:flex;align-items:center}
.itbl{width:100%;border-collapse:collapse;font:12px var(--sans);background:#fff;border:1px solid #9a9a9a}.itbl th{background:#ececec;text-align:left;padding:4px 8px;font-weight:600;border-bottom:1px solid #bbb}.itbl td{padding:5px 8px;border-bottom:1px solid #eee;font-family:var(--mono);font-size:11.5px}
/* explorer, editor */
.exp{position:absolute;background:#202124;border:1px solid #3a3b40;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;font-size:11.5px;color:#e5e5e8}
.exp .et{height:30px;display:flex;align-items:center;padding:0 12px;background:#2a2b30;font-size:11.5px;color:#cfcfd4;gap:8px}
.exp .addr{margin:8px 10px;height:28px;border:1px solid #3a3b40;border-radius:6px;background:#17181b;display:flex;align-items:center;padding:0 10px;gap:6px;color:#b9b9bf;font-size:11.5px;white-space:nowrap;overflow:hidden}.addr b{color:#fff;font-weight:600}
.exp .row{display:flex;align-items:center;gap:10px;height:28px;padding:0 14px;font-size:12px}.exp .row i{width:16px;height:13px;border-radius:2px;background:#e8b94a;display:inline-block;font-style:normal}.exp .row i.f{width:12px;height:15px;background:#8fb4ff}.exp .row u{margin-left:auto;text-decoration:none;color:#8a8a92;font-size:11px}
.exp .row.sel{background:#2f4a7d}
.ed{background:#1b1c20}
.edtool{position:absolute;left:0;right:0;top:32px;height:34px;background:#25262b;border-bottom:1px solid #34353b;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;color:#d5d5d8}
.edtool span{padding:5px 10px;border-radius:4px;background:#2d2f37}.edtool span.hot{background:#3b6fd4;color:#fff}
.edside{position:absolute;left:0;top:66px;bottom:150px;width:230px;border-right:1px solid #34353b;background:#1e1f24;padding:8px 0;font-size:11.5px;color:#cfcfd3}
.edside div{padding:3px 12px;white-space:nowrap}.edside .l2{padding-left:28px}.edside .l3{padding-left:44px}.edside .hot{background:#2f4a7d;color:#fff}
.code{position:absolute;left:230px;right:0;top:66px;bottom:150px;padding:12px 18px;font:500 12px/1.7 var(--mono);color:#cfd3dc;white-space:pre;overflow:hidden}.code .k{color:#c586c0}.code .s{color:#ce9178}.code .c{color:#6a9955}.code .t{color:#4ec9b0}
.edlog{position:absolute;left:0;right:0;bottom:0;height:150px;border-top:1px solid #34353b;background:#18191c}
.edlog .exlog{font-size:11.5px}
/* overlay widgets */
.ring{position:absolute;border:2.5px solid #3b82f6;border-radius:10px;box-shadow:0 0 0 4px rgba(59,130,246,.22),0 0 24px rgba(59,130,246,.5);visibility:hidden}
.tip{position:absolute;background:#3b82f6;color:#fff;border-radius:10px;padding:8px 14px;font:600 14px/1.3 var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.45);visibility:hidden;white-space:nowrap}
.tip .ar{position:absolute;width:12px;height:12px;background:#3b82f6;transform:rotate(45deg)}
.tip.g{background:#16a34a}.tip.g .ar{background:#16a34a}
.keys{position:absolute;left:0;right:0;top:566px;display:flex;justify-content:center;gap:10px;visibility:hidden}
.keys span{min-width:54px;height:46px;padding:0 16px;border-radius:10px;background:linear-gradient(#f4f4f6,#d4d5da);color:#17181c;font:700 19px var(--sans);display:grid;place-items:center;box-shadow:0 5px 0 #8e8f97,0 12px 24px rgba(0,0,0,.45)}
.cur{position:absolute;left:0;top:0;width:22px;height:26px;visibility:hidden;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));z-index:9}
.rip{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid rgba(255,255,255,.85);visibility:hidden;z-index:8}
.chip{position:absolute;display:flex;align-items:center;gap:8px;background:#101114;border:1px solid #2a2c33;border-radius:999px;padding:9px 16px 9px 12px;font:600 14px var(--sans);box-shadow:0 10px 30px rgba(0,0,0,.5);visibility:hidden;white-space:nowrap}
.chip b{color:#22c55e;font-size:15px}
/* hud */
#hud{position:absolute;inset:0;pointer-events:none;z-index:50}
#chip{position:absolute;left:34px;top:20px;height:30px;padding:0 14px 0 10px;border-radius:999px;background:rgba(20,22,28,.85);border:1px solid #2c2f38;display:flex;align-items:center;gap:8px;font:600 12.5px var(--sans);color:#dfe3ee;opacity:0}
#chip i{width:8px;height:8px;border-radius:50%;background:#3b82f6;box-shadow:0 0 10px #3b82f6}
#brand{position:absolute;right:34px;top:24px;font:700 14px var(--head);color:#9aa0b4;display:flex;align-items:center;gap:8px}
#brand .mark{width:12px;height:15px;border:1.8px solid #9aa0b4;border-radius:2px;display:inline-block}
#cap{position:absolute;left:50%;bottom:34px;width:1020px;margin-left:-510px;text-align:center;opacity:0}
#cap span{display:inline-block;background:rgba(6,7,10,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:11px 22px;font:500 21px/1.38 var(--sans);color:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#pstr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,10,.86);gap:8px}
#pstr .pb{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6);margin-bottom:14px}
#pstr .pb i{display:block;border-style:solid;border-width:22px 0 22px 36px;border-color:transparent transparent transparent #3b82f6;margin-left:10px}
#pstr b{font:700 34px var(--head)}#pstr span{font:500 18px var(--sans);color:#aab2c8}
#tick{position:absolute;left:0;top:0;width:2px;height:2px}
#prog{position:absolute;left:0;bottom:0;height:4px;background:#3b82f6;width:0}
/* title scenes */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font:700 62px/1.05 var(--head);letter-spacing:-1.5px;text-align:center}
.sub{font:500 22px var(--sans);color:#9aa3bd;text-align:center;margin-top:14px}
.mcard{position:absolute;width:420px;height:210px;border-radius:18px;background:#0e1018;border:1px solid #232634;padding:26px 28px;box-shadow:0 24px 70px rgba(0,0,0,.5);visibility:hidden}
.mcard h3{font:700 26px var(--head);margin:10px 0 8px}.mcard p{font-size:15.5px;color:#9aa3bd;line-height:1.55}
.mcard .n{display:inline-block;font:700 12px var(--sans);letter-spacing:1.5px;color:#7fb0ff;background:rgba(59,130,246,.14);border-radius:999px;padding:4px 12px}
.mcard.rec{border-color:#2d5bb8;box-shadow:0 24px 70px rgba(37,99,235,.28)}
.bigico{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;font:700 22px var(--head)}
.step7{position:absolute;display:flex;align-items:center;gap:14px;height:56px;width:470px;border-radius:14px;background:#0e1018;border:1px solid #232634;padding:0 18px;font:600 18px var(--sans);visibility:hidden}

/* ========== Scene class & overlay helpers ========== */
class Sc{
 constructor(info,html){this.info=info;this.id=info.id;this.D=info.dur;this.L=info.lines;
  this.el=document.createElement('div');this.el.className='scene';this.el.innerHTML=`<div class="cam">${html}</div><div class="ov"></div>`;
  stage.insertBefore(this.el,document.getElementById('hud'));this.cam=this.el.querySelector('.cam');this.ov=this.el.querySelector('.ov');this.k={};this.cache={};
  this.cur=this.mk('cur','svg','cur');this.cur.setAttribute('viewBox','0 0 22 26');this.cur.innerHTML='<path d="M2 1 L2 19 L6.5 15 L9.5 22 L12.5 20.7 L9.6 14 L16 14 Z" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round"/>';
  this.rip=this.mk('rip','div','rip');}
 q(s){return this.el.querySelector(s)}
 qa(s){return [...this.el.querySelectorAll(s)]}
 t0(i){return this.L[i].t0}
 mk(key,tag,cls,html){if(!this.k[key]){const e=tag==='svg'?document.createElementNS('http://www.w3.org/2000/svg','svg'):document.createElement(tag);e.setAttribute('class',cls);if(html)e.innerHTML=html;this.ov.appendChild(e);this.k[key]=e}return this.k[key]}
 rect(target){const sr=stage.getBoundingClientRect();
  if(Array.isArray(target))return{x:target[0],y:target[1],w:target[2]||0,h:target[3]||0};
  const e=typeof target==='string'?this.q(target):target;if(!e)return{x:640,y:360,w:0,h:0};
  const r=e.getBoundingClientRect();return{x:r.left-sr.left,y:r.top-sr.top,w:r.width,h:r.height}}
 /* simple appear/disappear */
 fx(el,t,t0,d=.5,kind='rise',t1=1e9,d1=.3){if(typeof el==='string')el=this.q(el);const p=eO(prog(t,t0,d));let o=p;if(t>t1)o*=1-prog(t,t1,d1);
  el.style.opacity=o;el.style.visibility=o>.002?'visible':'hidden';
  const y=kind==='rise'?(1-p)*16:kind==='drop'?-(1-p)*16:0,s=kind==='pop'?.93+.07*p:1,x=kind==='left'?-(1-p)*40:kind==='right'?(1-p)*40:0;

 num(el,t,t0,d,a,b,fmt){if(typeof el==='string')el=this.q(el);const p=eO(prog(t,t0,d));const s=fmt(lerp(a,b,p));if(el.textContent!==s)el.textContent=s}

  e.style.left=(r.x-pad)+'px';e.style.top=(r.y-pad)+'px';e.style.width=(r.w+pad*2)+'px';e.style.height=(r.h+pad*2)+'px';e.style.transform=`scale(${1+.012*Math.sin(t*6)})`}
 tip(key,target,text,side,t,t0,t1,cls=''){const e=this.mk('tip_'+key,'div','tip '+cls,'<span class="tx"></span><i class="ar"></i>');e.querySelector('.tx').textContent=text;
  const o=this.fx(e,t,t0,.4,'none',t1,.3);if(o<.002)return;const r=this.rect(target),w=e.offsetWidth,h=e.offsetHeight,ar=e.querySelector('.ar');let L,T;
  const cx=r.x+r.w/2,cy=r.y+r.h/2;
  if(side==='bottom'){L=cx-w/2;T=r.y+r.h+16}else if(side==='top'){L=cx-w/2;T=r.y-h-16}else if(side==='right'){L=r.x+r.w+16;T=cy-h/2}else{L=r.x-w-16;T=cy-h/2}
  L=clamp(L,14,W-w-14);T=clamp(T,56,H-h-90);

  e.style.left=L+'px';e.style.top=T+'px';e.style.transform=`translateY(${(1-eO(prog(t,t0,.4)))*8}px)`}
 keys(key,labels,t,t0,t1){const e=this.mk('keys_'+key,'div','keys',labels.map(l=>`<span>${l}</span>`).join(''));this.fx(e,t,t0,.3,'rise',t1,.25)}

/* ========== HUD + seek ========== */
const hud={chip:document.getElementById('chip'),cap:document.getElementById('cap'),prog:document.getElementById('prog')};
let TK=0;
function seek(T){
 const sc=TL.scenes;let cur=sc[sc.length-1];for(const s of sc)if(T>=s.start&&T<s.start+s.dur){cur=s;break}
 const lt=clamp(T-cur.start,0,cur.dur);

 /* chip */
 const ch=hud.chip;if(cur.tag){ch.querySelector('span').textContent=cur.tag;ch.style.opacity=Math.min(prog(lt,.2,.4),1-prog(lt,cur.dur-.4,.3))}else ch.style.opacity=0;
 /* caption */
 let line=null,idx=-1;cur.lines.forEach((l,i)=>{if(lt>=l.t0-.12)idx=i});
 if(idx>=0){line=cur.lines[idx];const end=idx<cur.lines.length-1?cur.lines[idx+1].t0-.1:line.t1+.7;const o=Math.min(prog(lt,line.t0-.12,.2),1-prog(lt,end-.15,.15));
  const sp=hud.cap.querySelector('span');if(sp.textContent!==line.cap)sp.textContent=line.cap;hud.cap.style.opacity=o}else hud.cap.style.opacity=0;

 if(window.POSTER){hud.cap.style.opacity=0;hud.chip.style.opacity=0;hud.prog.style.width='0';document.getElementById('pstr').style.display='flex'}
 TK++;document.getElementById('tick').style.background='rgb('+(TK%3)+','+(TK%3)+','+(TK%3)+')';
}
